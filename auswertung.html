<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a44">
  <title>Auswertung – Pub-Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auswertung">
  <header class="kopf">
    <div class="kopf-titel gross-titel">📊 Auswertung</div>
    <button id="aktualisieren" class="kopf-knopf">↻</button>
    <span id="verbindung" class="verbindung">…</span>
  </header>
  <p id="demo-hinweis" class="demo" hidden>DEMO-MODUS – Supabase noch nicht eingetragen.</p>

  <main class="auswertung-inhalt">
    <section class="kacheln" id="kacheln"></section>

    <nav class="reiter auswertung-reiter">
      <button class="aktiv" data-seite="tische">Pro Tisch</button>
      <button data-seite="artikel">Artikel</button>
      <button data-seite="kellner">Kellner</button>
    </nav>

    <section id="seite-tische"><div id="tische" class="liste"></div></section>
    <section id="seite-artikel" hidden><div class="block"><table class="tabelle" id="artikel-tabelle"></table></div></section>
    <section id="seite-kellner" hidden><div class="block"><table class="tabelle" id="kellner-tabelle"></table></div></section>

    <p class="klein-hinweis fuss-hinweis">Enthält alle nicht stornierten Bestellungen (offen und erledigt). Aktualisiert sich automatisch.
      Snacks auf den Tischen (1,00 €) sind nicht enthalten.</p>
  </main>

  <script src="config.js"></script>
  <script src="vendor/supabase-js-2.117.3.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auswertung.js"></script>
</body>
</html>
