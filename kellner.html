<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2b2b">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kellner – Pub-Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="kellner">
  <header class="kopf">
    <a href="./" class="home-knopf logo-knopf" aria-label="Zur Auswahl" title="Zur Auswahl"><img src="img/logo-klein.jpg" alt="Gutholz Schiltach"></a>
    <div>
      <div class="kopf-titel">Kellner: <b id="kellner-name">–</b></div>
      <button id="kellner-wechseln" class="link">wechseln</button>
    </div>
    <span id="verbindung" class="verbindung">…</span>
  </header>
  <p id="demo-hinweis" class="demo" hidden>DEMO-MODUS – Supabase noch nicht eingetragen. Daten nur auf diesem Gerät.</p>

  <nav class="reiter">
    <button class="aktiv" data-seite="neu">Bestellen</button>
    <button data-seite="offen">Offen <span id="offen-zahl"></span></button>
    <button data-seite="kasse">💶 Kasse</button>
  </nav>

  <main id="seite-neu">
    <section class="block">
      <h2 id="tisch-titel">1. Tisch wählen</h2>
      <div id="tisch-gewaehlt" class="tisch-gewaehlt" hidden>
        <span id="tisch-gewaehlt-text"></span>
        <button id="tisch-aendern">ändern</button>
      </div>
      <button id="wiederholen" class="wiederholen" hidden></button>
      <div id="tisch-raster"></div>
    </section>

    <section class="block">
      <h2>2. Artikel</h2>
      <div class="suche-box">
        <input id="suche" type="search" placeholder="🔍 Artikel suchen …" autocomplete="off" enterkeyhint="search">
        <button id="suche-leeren" class="suche-leeren" aria-label="Suche leeren" hidden>✕</button>
      </div>
      <div id="artikel"></div>
    </section>

    <section class="block">
      <h2>3. Kommentar <small>(optional)</small></h2>
      <textarea id="kommentar" rows="2" maxlength="300" placeholder="z. B. ohne Zwiebeln"></textarea>
      <button id="leeren" class="link warnung" hidden>Alles verwerfen</button>
    </section>
  </main>

  <main id="seite-offen" hidden>
    <div id="offen-liste" class="liste einspaltig"></div>
  </main>

  <main id="seite-kasse" hidden>
    <p id="kassenstand" class="kassenstand"></p>
    <section class="block">
      <h2>Tisch abrechnen</h2>
      <div id="kasse-raster" class="tisch-raster"></div>
    </section>
    <div id="kasse-inhalt"></div>
  </main>

  <footer class="fusszeile">
    <span id="summe"></span>
    <button id="absenden" class="gross primaer" disabled>Absenden</button>
  </footer>

  <script src="config.js"></script>
  <script src="vendor/supabase-js-2.117.3.js"></script>
  <script src="js/common.js"></script>
  <script>App.starte(["js/kellner.js", "js/kasse.js"]);</script>
</body>
</html>
