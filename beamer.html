<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <title>Beamer – Pub-Quiz</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="beamer.css">
</head>
<body class="beamer">
  <header class="b-kopf">
    <img src="img/logo.jpg" alt="Gutholz Schiltach" class="b-logo">
    <div>
      <div class="b-titel">Pub-Quiz – Zwischenstand</div>
      <div id="veranstaltung" class="b-untertitel"></div>
    </div>
    <div class="b-pause-badge" id="pause-badge" hidden></div>
    <div class="b-uhr" id="uhr"></div>
  </header>

  <main id="folien" class="b-folien"></main>

  <footer class="b-fuss-leiste">
    <div class="b-punkte" id="punkte"></div>
    <div class="b-fortschritt"><div id="balken"></div></div>
  </footer>

  <div class="b-steuerung">
    <button id="vollbild" title="Vollbild">⛶ Vollbild</button>
    <button id="pause-knopf" title="Pause mit Countdown starten">⏸ Pause</button>
  </div>
  <div id="konfetti" class="b-konfetti" aria-hidden="true"></div>

  <script src="config.js"></script>
  <script src="vendor/supabase-js-2.117.3.js"></script>
  <script src="js/common.js"></script>
  <script>App.starte(["js/beamer.js"], { ohneDurchsagen: true });</script>
</body>
</html>
